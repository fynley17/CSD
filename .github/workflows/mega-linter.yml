# Runs megalinter on every pull request into main (CTS-124, updated in CTS-155)
name: MegaLinter

on:
    pull_request:
        branches: [main]

permissions:
    contents: read
    pull-requests: write

jobs:
    megalinter:
        name: MegaLinter
        runs-on: ubuntu-latest
        steps:
            - name: Check out the code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Run MegaLinter
              uses: oxsecurity/megalinter@v10
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 