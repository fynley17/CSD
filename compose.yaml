services:
    db:
        image: mariadb:11.4
        environment:
            MARIADB_DATABASE: ${MARIADB_DATABASE:-revisionhub}
            MARIADB_USER: ${MARIADB_USER:-revisionhub_dev}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD:-revisionhub_dev}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local_dev_only}
        ports:
            - "127.0.0.1:${DB_PORT:-3306}:3306"
        volumes:
            - mariadb_data:/var/lib/mysql
            - ./database/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    phpmyadmin:
        image: phpmyadmin:5.2-apache
        depends_on:
            db:
                condition: service_healthy
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
        ports:
            - "127.0.0.1:${PMA_PORT:-8081}:80"

volumes:
    mariadb_data:
